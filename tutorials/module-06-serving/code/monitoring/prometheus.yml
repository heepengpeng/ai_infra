# Prometheus 抓取配置:pull 模型,定时去各 /metrics 端点拉指标。
# 注意:容器内访问宿主机服务用 host.docker.internal(Linux 需在 compose 加 extra_hosts)。

global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  # TODO(实验 D): 补全 vLLM 服务的 scrape 配置。
